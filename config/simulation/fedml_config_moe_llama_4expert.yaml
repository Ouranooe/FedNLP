common_args:
  training_type: "simulation"
  random_seed: 0

data_args:
  dataset: "sst_2"
  data_file_path: ~/fednlp_data/data_files/sst_2_data.h5
  partition_file_path: ~/fednlp_data/partition_files/sst_2_partition.h5
  partition_method: "niid_label_clients=20_alpha=1"
  reprocess_input_data: false

model_args:
  # 真正�?MoE-LLaMA（独�?个LLaMA专家�?
  model_type: "moe_llama"
  model_class: "transformer"
  # LLaMA基座（可替换为你本地/私有HF模型�?
  model: "HuggingFaceTB/SmolLM-135M"
  do_lower_case: false
  formulation: "classification"

moe_args:
  # 专家数（每个专家是一个独�?LLaMA�?
  moe_num_experts: 4
  # 稀疏激�?top-k
  moe_top_k: 1
  # Router softmax 温度
  moe_router_temperature: 1.0
  # 负载均衡辅助损失系数
  moe_load_balance_loss_coef: 0.01

train_args:
  federated_optimizer: "FedAvg"
  client_id_list: "[]"
  client_num_in_total: 20
  client_num_per_round: 4
  comm_round: 3
  epochs: 1
  batch_size: 8
  eval_batch_size: 8
  max_seq_length: 64
  fp16: true
  output_dir: "./outputs/moe_llama_4expert"
  client_optimizer: AdamW
  server_optimizer: sgd
  server_momentum: 0.9
  server_lr: 0.1
  learning_rate: 0.0001
  weight_decay: 0.001
  gradient_accumulation_steps: 1
  clip_grad_norm: true
  fedprox_mu: 0
  evaluate_during_training: false
  evaluate_during_training_steps: 10
  freeze_layers: ''
  is_debug_mode: false
  momentum: 0.9
  max_grad_norm: 1
  ci: 0

validation_args:
  frequency_of_the_test: 1

device_args:
  worker_num: 1
  using_gpu: true
  gpu_mapping_file: config/simulation/gpu_mapping.yaml
  gpu_mapping_key: mapping_default

comm_args:
  backend: "sp"
  is_mobile: 0

tracking_args:
  enable_wandb: false
  wandb_entity: fedml-team
  wandb_only_server: true
  wandb_key: 404bae40078b1624faed523c4e9d25b40590e537
  wandb_project: fednlp_moe
  wandb_name: fedml_moe_llama_4expert
