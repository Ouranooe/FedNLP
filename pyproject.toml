[project]
name = "fednlp-text-classification"
version = "0.1.0"
description = "Federated NLP text classification with MoR/MoE LLaMA"
requires-python = ">=3.9,<3.12"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers==4.53.3",
    "fedml>=0.8.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "pandas>=1.5.0",
    "omegaconf>=2.3.0",
    "wandb",
    "tqdm>=4.65.0",
    "h5py>=3.8.0",
    "Pillow>=9.5.0",
]

